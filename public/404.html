<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Saish's Website</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any unknown path. It rewrites the
      // path into a query string and redirects to the app root, where the
      // snippet in index.html restores the real path for the router.
      // pathSegmentsToKeep = 0 for a user/org site served at the domain root.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
